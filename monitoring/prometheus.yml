global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "openmrs-core"
    environment: "tp2-demo"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"

  - job_name: "cadvisor"
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"

  - job_name: "openmrs-jvm"
    scrape_interval: 30s
    static_configs:
      - targets: ["api:9404"]
        labels:
          service: "openmrs-jvm"