name: TP2 DevOps Quality Extension

on:
  workflow_dispatch:
  push:
    branches:
      - feature/devops-quality-pipeline
      - tp2/**
  pull_request:
    branches:
      - master
    paths:
      - 'docker-compose.yml'
      - 'monitoring/**'
      - 'promtail-config.yml'
      - 'otel-app/**'
      - '.github/workflows/openmrs-ci.yml'

concurrency:
  group: tp2-devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Quick Maven validation
        run: mvn -B -q -DskipTests clean package

      - name: Start test and observability stack
        run: docker compose up -d --build

      - name: Show running containers
        run: docker ps

      - name: Wait for OpenMRS
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/openmrs/ >/dev/null; then
              echo "OpenMRS is up"
              exit 0
            fi
            echo "Waiting for OpenMRS..."
            sleep 15
          done
          echo "OpenMRS did not start in time"
          docker compose logs api
          exit 1

      - name: Smoke test OpenMRS
        run: |
          curl -I http://localhost:8080/openmrs/

      - name: Smoke test otel-app
        run: |
          curl -fsS http://localhost:3001/

      - name: Wait for Prometheus
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:9090/-/ready >/dev/null; then
              echo "Prometheus is ready"
              exit 0
            fi
            echo "Waiting for Prometheus..."
            sleep 10
          done
          docker compose logs prometheus
          exit 1

      - name: Check Prometheus targets page
        run: |
          curl -fsS http://localhost:9090/api/v1/targets | head -c 1000 || true

      - name: Wait for Grafana
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "Grafana is ready"
              exit 0
            fi
            echo "Waiting for Grafana..."
            sleep 10
          done
          docker compose logs grafana
          exit 1

      - name: Wait for Jaeger
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:16686/ >/dev/null; then
              echo "Jaeger is ready"
              exit 0
            fi
            echo "Waiting for Jaeger..."
            sleep 10
          done
          docker compose logs jaeger
          exit 1

      - name: Generate traces through otel-app
        run: |
          curl -fsS http://localhost:3001/
          curl -fsS http://localhost:3001/
          curl -fsS http://localhost:3001/

      - name: Show service logs
        if: always()
        run: |
          docker compose logs --no-color > tp2-compose-logs.txt || true
          tail -n 200 tp2-compose-logs.txt || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp2-compose-logs
          path: tp2-compose-logs.txt
          if-no-files-found: warn

      - name: Shutdown environment
        if: always()
        run: docker compose down -v