name: TP2 DevOps Quality Extension

on:
  workflow_dispatch:
  push:
    branches:
      - devops-quality-process
  pull_request:
    branches:
      - master
    paths:
      - 'docker-compose.yml'
      - 'monitoring/**'
      - 'promtail-config.yml'
      - 'otel-app/**'
      - '.github/workflows/openmrs-ci.yml'

concurrency:
  group: tp2-devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # JOB 1 — Code quality gate: tests + coverage + static analysis
  # Addresses TP1 findings: low/uneven test coverage, code smells,
  # deprecated APIs, supply-chain vulnerabilities.
  # ──────────────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate (tests + coverage + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests with JaCoCo coverage
        run: mvn -B -pl api -am test jacoco:report
        # -am: also build upstream modules that api depends on (parent POM, etc.)
        # api module has the highest coverage obligations (TP1: 68% instruction / 61% branch)

      - name: Enforce coverage thresholds (60% instruction / 55% branch)
        run: mvn -B -pl api jacoco:check

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/target/site/jacoco/
          if-no-files-found: warn

      - name: Run Checkstyle (code style — TP1 finding)
        run: mvn -B -pl api checkstyle:check
        continue-on-error: true

      - name: Run SpotBugs static analysis (TP1 finding)
        run: mvn -B -pl api spotbugs:check
        continue-on-error: true

      - name: SonarCloud analysis (TP1 — 1000+ code smells baseline)
        uses: sonarsource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=openmrs_openmrs-core
            -Dsonar.organization=openmrs
            -Dsonar.java.binaries=api/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml
        continue-on-error: true

      - name: Generate SBOM — CycloneDX (TP1 supply-chain recommendation)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom -DincludeLicenseText=false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.xml
          if-no-files-found: warn

  # ──────────────────────────────────────────────────────────────────────
  # JOB 2 — Infrastructure: deploy full observability stack + smoke tests
  # ──────────────────────────────────────────────────────────────────────
  deploy-test-observe:
    name: Deploy & Observe
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build application artifact (tests already run in quality-gate job)
        run: mvn -B -q -DskipTests clean package

      - name: Start test and observability stack
        run: docker compose up -d --build

      - name: Show running containers
        run: docker ps

      - name: Wait for OpenMRS
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:8080/openmrs/ >/dev/null; then
              echo "OpenMRS is up"
              exit 0
            fi
            echo "Waiting for OpenMRS..."
            sleep 15
          done
          echo "OpenMRS did not start in time"
          docker compose logs api
          exit 1

      - name: Smoke test OpenMRS
        run: |
          curl -I http://localhost:8080/openmrs/

      - name: Smoke test otel-app
        run: |
          curl -fsS http://localhost:3001/

      - name: Wait for Prometheus
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:9090/-/ready >/dev/null; then
              echo "Prometheus is ready"
              exit 0
            fi
            echo "Waiting for Prometheus..."
            sleep 10
          done
          docker compose logs prometheus
          exit 1

      - name: Check Prometheus targets page
        run: |
          curl -fsS http://localhost:9090/api/v1/targets | head -c 1000 || true

      - name: Wait for Grafana
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "Grafana is ready"
              exit 0
            fi
            echo "Waiting for Grafana..."
            sleep 10
          done
          docker compose logs grafana
          exit 1

      - name: Wait for Jaeger
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:16686/ >/dev/null; then
              echo "Jaeger is ready"
              exit 0
            fi
            echo "Waiting for Jaeger..."
            sleep 10
          done
          docker compose logs jaeger
          exit 1

      - name: Generate traces through otel-app
        run: |
          curl -fsS http://localhost:3001/
          curl -fsS http://localhost:3001/
          curl -fsS http://localhost:3001/

      - name: Install k6 load testing tool
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -y k6

      - name: Run k6 smoke test — OpenMRS availability (TP2 performance)
        run: |
          k6 run \
            -e BASE_URL=http://localhost:8080 \
            --out json=k6-ci-results.json \
            load-test-openmrs-basic.js
        continue-on-error: true

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: k6-ci-results.json
          if-no-files-found: warn

      - name: Show service logs
        if: always()
        run: |
          docker compose logs --no-color > tp2-compose-logs.txt || true
          tail -n 200 tp2-compose-logs.txt || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp2-compose-logs
          path: tp2-compose-logs.txt
          if-no-files-found: warn

      - name: Shutdown environment
        if: always()
        run: docker compose down -v