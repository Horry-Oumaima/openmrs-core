server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push


scrape_configs:
  - job_name: openmrs-docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: openmrs
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      # Docker wraps logs in JSON: {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            output: log
            stream: stream
      # Extract container name from the filename label
      - regex:
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.+'
          source: filename
      # Parse log level from common patterns: INFO, WARN, ERROR, DEBUG
      - regex:
          expression: '(?i)(level|lvl|severity)[=:\s]+(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)'
          source: output
      # Also catch bare level keywords at line start
      - regex:
          expression: '^\s*(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL)'
          source: output
      - labels:
          stream:
          level:
      - output:
          source: output
